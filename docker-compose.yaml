# =============================================================================
# docker-compose.yaml — base configuration (shared by dev & prod)
# Use with: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up
#           docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up
#
# docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build
# docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
# docker compose -f docker-compose.yaml -f docker-compose.dev.yaml stop
# docker compose -f docker-compose.yaml -f docker-compose.dev.yaml down
# =============================================================================

name: pern-ts

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------------------
  db:
    build: ./apps/db/
    image: pern-db-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_pern_data:/var/lib/postgresql
      - ./apps/db/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-app}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis database
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: redis_cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Express / Node.js API server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: . # adjust if your server app lives elsewhere
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-4000}
      CLIENT_URL: http://localhost:${CLIENT_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-300}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET?JWT_REFRESH_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:${API_PORT:-4000}/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Ports and volumes are extended in the environment-specific files

    # ---------------------------------------------------------------------------
    # React front-end
    # ---------------------------------------------------------------------------
  client:
    build:
      context: . # adjust if your React app lives elsewhere
      dockerfile: ./apps/client/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://localhost:${API_PORT:-4000}
    # Ports are extended in the environment-specific files

  # ---------------------------------------------------------------------------
  # Admin — TanStack Router server
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: . # adjust if your React app lives elsewhere
      dockerfile: ./apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://localhost:${API_PORT:-4000}

volumes:
  postgres_pern_data:
